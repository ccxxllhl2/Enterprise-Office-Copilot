services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    expose:
      - "8080"
    restart: unless-stopped

  agent-service:
    build:
      context: .
      dockerfile: agent-service/Dockerfile
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API}
    expose:
      - "3000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
      - agent-service
    restart: unless-stopped
